
<!DOCTYPE html>
<html>
  <head>
    <title>Simple Polyline</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD_-DylnZGJXFA4AgWo6XK-qp7eBXqml-U"></script>
    <script>
      function initMap() {
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 10,
          center: { lat: 37.772, lng: -122.214 },
        });

        const routePath = new google.maps.Polyline({
          path: [
            { lat: 37.772, lng: -122.214 },
        { lat: 37.871, lng: -122.273 },
        { lat: 37.774, lng: -122.419 },
        { lat: 37.804, lng: -122.271 }
          ],
          geodesic: true,
          strokeColor: "#FF0000",
          strokeOpacity: 1.0,
          strokeWeight: 4,
        });

        routePath.setMap(map);
      }
    </script>
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
    </style>
  </head>
  <body onload="initMap()">
    <div id="map"></div>
  </body>
</html>
